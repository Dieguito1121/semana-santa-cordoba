
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semana Santa Simulator Córdoba</title>
<style>
body{margin:0;overflow:hidden;background:#101522;font-family:Arial;color:white}
#ui{position:absolute;top:15px;left:15px;z-index:2;background:#101b2bdd;padding:15px;border:1px solid #c59b45;border-radius:12px}
#ui h2{margin:0 0 8px;color:#e7c36c;font-size:19px}
#ui p{font-size:13px;margin:5px 0}
#help{position:absolute;bottom:15px;left:15px;background:#101b2ddd;padding:12px;border-radius:10px;font-size:13px}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:#101522;z-index:5}
</style>
</head>
<body>
<div id="loading">Preparando nuestra procesión...</div>
<div id="ui">
<h2>SEMANA SANTA CÓRDOBA</h2>
<p>Hermandad del Buen Suceso</p>
<p>María Santísima de la Caridad</p>
<p id="status">Procesión preparada</p>
</div>
<div id="help">W / S: avanzar y retroceder<br>A / D: girar el paso<br>ESPACIO: detenerse</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101827);
scene.fog=new THREE.Fog(0x101827,35,100);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);
camera.position.set(0,9,17);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xabbcdd,0x493321,2));

const moon=new THREE.DirectionalLight(0xffdfad,3);
moon.position.set(-8,15,8);
moon.castShadow=true;
scene.add(moon);

function material(color,metalness=0,roughness=.7){
return new THREE.MeshStandardMaterial({color,metalness,roughness});
}
function box(parent,x,y,z,w,h,d,mat){
const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
parent.add(m);return m;
}
function sphere(parent,x,y,z,r,mat){
const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,16),mat);
m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m;
}

// Calle cordobesa
const ground=box(scene,0,-.25,0,30,.5,100,material(0x827b6c));
ground.receiveShadow=true;

const walls=material(0xd6b994);
for(let z=-35;z<35;z+=12){
box(scene,-12,3,z,5,6,10,walls);
box(scene,12,3,z,5,6,10,walls);
for(let side of [-1,1]){
for(let y of [2,3.5]){
box(scene,side*12,y,z,5.1,.18,10.1,material(0x9d7657));
}
}
}

// Puertas y ventanas
for(let z=-35;z<35;z+=12){
for(let side of [-1,1]){
box(scene,side*9.43,1.3,z, .12,2.4,1.3,material(0x533c31));
box(scene,side*9.43,3.8,z, .12,1.2,1.3,material(0x354b62));
}
}

// Farolas
for(let z=-28;z<35;z+=14){
for(let side of [-1,1]){
const x=side*7;
box(scene,x,2,z,.13,4,.13,material(0x292a30,.7));
sphere(scene,x,4.1,z,.3,material(0xffd68a,.2));
}
}

// Paso procesional
const paso=new THREE.Group();
scene.add(paso);
paso.position.set(0,0,2);

const gold=material(0xb58a36,.75,.3);
const darkGold=material(0x76501c,.65,.35);
const velvet=material(0x241c43);
const silver=material(0xc9cbd0,.8,.2);

// Parihuela y respiraderos
box(paso,0,.65,0,5,.45,2.4,darkGold);
box(paso,0,.92,0,5.1,.13,2.5,gold);
box(paso,0,.4,0,5.3,.15,2.6,velvet);

// Molduras
for(let x of [-2.35,2.35]){
box(paso,x,1.05,0,.15,.5,2.3,gold);
}
for(let z of [-1.12,1.12]){
box(paso,0,1.05,z,4.8,.5,.12,gold);
}

// Flores
const flowerColors=[0xe9d7df,0xf5f0e9,0x9b284b,0xf2a6b8];
for(let i=0;i<100;i++){
const x=(Math.random()-.5)*4.5;
const z=(Math.random()-.5)*1.9;
const y=1.35+Math.random()*.22;
sphere(paso,x,y,z,.09,material(flowerColors[i%4]));
}

// Candelería
for(let x=-1.9;x<=1.9;x+=.48){
for(let z of [-.8,.8]){
box(paso,x,1.65,z,.045,.65,.045,gold);
sphere(paso,x,2.02,z,.07,material(0xffd99a));
}
}

// Varales
for(let x of [-2.1,-1.4,-.7,0,.7,1.4,2.1]){
for(let z of [-1.05,1.05]){
const pole=new THREE.Mesh(new THREE.CylinderGeometry(.035,.045,3.3,12),gold);
pole.position.set(x,2.7,z);pole.castShadow=true;paso.add(pole);
}
}

// Techo del palio
box(paso,0,4.4,0,5.2,.16,2.7,velvet);
box(paso,0,4.5,0,5.3,.08,2.8,gold);

// Bambalinas
for(let z of [-1.36,1.36]){
box(paso,0,4,.0+z,5.3,.7,.12,velvet);
for(let x=-2.4;x<=2.4;x+=.3){
sphere(paso,x,3.6,z,.07,gold);
}
}
for(let x of [-2.65,2.65]){
box(paso,x,4,0,.12,.7,2.7,velvet);
}

// Representación provisional de la Virgen
const statue=new THREE.Group();
paso.add(statue);
sphere(statue,0,2.4,0,.38,material(0xe1b99b));
const mantle=new THREE.Mesh(
new THREE.ConeGeometry(.9,1.5,5),
material(0x263b72,.2,.5)
);
mantle.position.set(0,1.9,0);
mantle.castShadow=true;statue.add(mantle);
const crown=new THREE.Mesh(new THREE.ConeGeometry(.27,.45,12),gold);
crown.position.set(0,2.86,0);statue.add(crown);

// Cruz ornamental trasera
box(paso,0,3.1,-.5,.08,1.1,.08,gold);
box(paso,0,3.35,-.5,.55,.08,.08,gold);

// Cámara y controles
let keys={};
let moving=true;
window.addEventListener('keydown',e=>{
keys[e.key.toLowerCase()]=true;
if(e.code==='Space')moving=!moving;
});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function animate(){
requestAnimationFrame(animate);
if(moving){
if(keys.w)paso.position.z-=.045;
if(keys.s)paso.position.z+=.045;
if(keys.a)paso.rotation.y+=.012;
if(keys.d)paso.rotation.y-=.012;
}
const target=new THREE.Vector3(
paso.position.x,2.1,paso.position.z
);
const desired=new THREE.Vector3(
paso.position.x,8,paso.position.z+12
);
camera.position.lerp(desired,.04);
camera.lookAt(target);
renderer.render(scene,camera);
document.getElementById('status').textContent=
moving?'Procesión en marcha':'Paso detenido';
}
document.getElementById('loading').remove();
animate();

window.addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
